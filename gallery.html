<!DOCTYPE html>
<html lang="ru">
<head>

    <script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея - Stradivari</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a0f0a 0%, #2d1810 50%, #1a0f0a 100%);
            min-height: 100vh;
            font-family: 'Cormorant Garamond', serif;
            color: #d4b896;
            padding: 52px 20px;
            position: relative;
        }

        /* Кнопка меню */
        .menu-btn {
            position: fixed;
            top: 20px;
            right: 30px;
            width: 50px;
            height: 50px;
            background: rgba(232, 212, 184, 0.1);
            border: 1px solid rgba(232, 212, 184, 0.3);
            border-radius: 8px;
            cursor: pointer;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .menu-btn:hover {
            background: rgba(232, 212, 184, 0.2);
            border-color: rgba(232, 212, 184, 0.5);
        }

        .menu-btn span {
            width: 24px;
            height: 2px;
            background: #e8d4b8;
            transition: all 0.3s ease;
        }

        /* Меню */
        .menu {
            position: fixed;
            top: -100%;
            left: 0;
            width: 100%;
            background: rgba(26, 15, 10, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(139, 111, 71, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            z-index: 999;
            transition: top 0.4s ease;
            padding: 25px 40px 30px;
        }

        .menu.active {
            top: 0;
        }

        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 998;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .menu-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .menu-items {
            list-style: none;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 60px;
            margin-top: 0px;
        }

        .menu-items li {
            margin-bottom: 0;
        }

        .menu-items a {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: #d4b896;
            text-decoration: none;
            transition: color 0.3s ease;
            display: block;
        }

        .menu-items a:hover {
            color: #e8d4b8;
        }

        .menu-items a.active {
            color: #e8a850;
        }

        /* Виньетка по бокам */
        body::before,
        body::after {
            content: '';
            position: fixed;
            top: 0;
            bottom: 0;
            width: 30%;
            pointer-events: none;
            z-index: 1;
        }

        body::before {
            left: 0;
            background: linear-gradient(to right, 
                rgba(0, 0, 0, 0.8) 0%,
                rgba(0, 0, 0, 0.4) 40%,
                transparent 100%
            );
        }

        body::after {
            right: 0;
            background: linear-gradient(to left, 
                rgba(0, 0, 0, 0.8) 0%,
                rgba(0, 0, 0, 0.4) 40%,
                transparent 100%
            );
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
            animation: fadeIn 1.5s ease-in;
            position: relative;
            z-index: 2;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 5rem;
            font-weight: 700;
            color: #e8d4b8;
            text-align: center;
            margin-bottom: 0.5rem;
            letter-spacing: 0.15em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .gallery-grid img {
            height: 200px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-top: 3rem;
        }

        .gallery-grid img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 8px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .gallery-grid img:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 24px rgba(232, 212, 184, 0.3);
        }

        .vk-section {
            margin-top: 60px;
            text-align: center;
        }

        .vk-text {
            font-size: 1.4rem;
            color: #c4a67a;
            margin-bottom: 25px;
            letter-spacing: 0.05em;
        }

        .vk-button {
            display: inline-block;
            padding: 15px 45px;
            background: rgba(0, 119, 255, 0.15);
            border: 2px solid #0077FF;
            border-radius: 8px;
            color: #0077FF;
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            text-decoration: none;
            transition: all 0.3s ease;
            letter-spacing: 0.05em;
        }

        .vk-button:hover {
            background: rgba(0, 119, 255, 0.25);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 119, 255, 0.3);
        }

        @media (max-width: 768px) {
            body::before,
            body::after {
                width: 20%;
            }

            .menu-btn {
                top: 20px;
                right: 20px;
                width: 45px;
                height: 45px;
            }

            .menu {
                padding: 27px 20px 25px;
            }

            .menu-items {
                flex-direction: column;
                gap: 20px;
            }

            .menu-items a {
                font-size: 1.5rem;
            }

            h1 {
                font-size: 2.5rem;
                letter-spacing: 0.1em;
                padding: 20px;
            }

            .gallery-grid {
                grid-template-columns: repeat(1, 1fr);
                gap: 15px;
            }

            .vk-section {
                margin-top: 40px;
            }

            .vk-text {
                font-size: 1.2rem;
            }

            .vk-button {
                padding: 12px 35px;
                font-size: 1.1rem;
            }
        }
 
    </style>
</head>
<body>
    <!-- Кнопка меню -->

    <!-- Оверлей -->

    <!-- Меню -->
    <nav class="menu">
        <ul class="menu-items">
            <li><a href="index.html">Главная</a></li>

            <li><a href="gallery.html" class="active">Галерея</a></li>
        </ul>
    </nav>

    <div class="container">

</div>
        
        <div style="width: 150px; height: 1px; background: linear-gradient(to right, transparent, #8b6f47, transparent); margin: 3rem auto;"></div>
        
        <div class="vk-section">
            <p class="vk-text">Больше информации по ссылке в VK</p>
            <a href="https://vk.com/stradivarigus17" target="_blank" class="vk-button">Перейти в VK</a>
        </div>
        
    </div>

    <script>
        function toggleMenu() {
            const menu = document.querySelector('.menu');
            const overlay = document.querySelector('.menu-overlay');
            menu.classList.toggle('active');
            overlay.classList.toggle('active');
        }
    </script>
</body>
</html>
